[tools]
pkl = "latest"
hk = { version = "latest", os = ["linux"] }
markdownlint-cli2 = { version = "latest", os = ["linux"] }
oxfmt = "latest"

[tasks.fix]
alias = "f"
description = "run project formatters declared in hk.pkl in 'fix' mode"
run = "hk fix --all"

[tasks.check]
alias = "c"
description = "run project linters declared in hk.pkl in 'check' mode"
run = "hk check --all"
